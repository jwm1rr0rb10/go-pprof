name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: benchmarks (smoke)
        run: go test -run='^$' -bench=. -benchtime=1x ./...
      - name: staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      # pprofprom is a separate module; the root ./... does not include it.
      - name: pprofprom vet and test
        working-directory: pprofprom
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: pprofprom staticcheck
        if: matrix.go == 'stable'
        working-directory: pprofprom
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
